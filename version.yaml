version: 2.22.0
changeLogLink: https://github.com/whyour/qinglong/blob/master/docs/releases/2.22.0.md
publishTime: 2026-09-26 0000
changeLog: |
  1. 新增独立远程 CLI，覆盖任务、订阅、环境变量、配置、脚本等 OpenAPI
  2. 新增可选面板内部 TypeScript 工具，默认保留 Shell 入口
  3. 仪表盘支持查看今日成功和失败任务明细
  4. 新增客户端 IP 与代理链诊断、可信代理设置和登录 IP 黑名单
  5. 新增历史运行实例和统计数据清理预览、手动清理及数据库压缩
  6. 新增 WPUSH 通知，支持面板、JS、Python 和 gRPC
  7. 新增 ql log 服务日志命令，优化大目录和大日志读取，修复中文日志名
  8. 修复任务结束后大日志尾部未读完的问题
  9. 修复调度锁、调度恢复、执行就绪和任务停止竞争，准确反馈停止失败
  10. 加固密码存储、JWT 与两步验证、文件访问和旧文件接口
  11. 修复登录令牌过期后页面反复刷新，完善任务参数校验提示
  12. 降低常驻依赖、指标缓存和重复 WebSocket 鉴权开销
  13. 优化 Node 路径缓存及 Alpine 并发缓存锁，修复依赖安装状态
  14. 改善启动错误诊断，保留用户 .env 配置，严格处理数据库迁移失败
  15. 镜像增加来源证明、SBOM 和构建产物一致性校验，改进多架构构建
  16. 升级前请备份完整数据；密码迁移后回退旧版需恢复升级前数据或重置账号
