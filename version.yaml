version: 2.24.0-dev.0
changeLogLink: https://github.com/whyour/qinglong/blob/develop/docs/releases/2.24.0-dev.0.md
publishTime: "2026-10-25 19:22:54"
changeLog: |
  1. 开发候选 2.24.0-dev.0，尚未正式发布；以 2.23.0 为上一正式版本
  2. Alpine 与 Debian 镜像统一使用 Node.js 24，升级 sqlite3 至 1.1.4
  3. Alpine 保留 arm/v6 和 arm/v7；Debian 暂不提供 arm/v7 镜像
  4. ARM64 升级包在原生 runner 构建，避免 x64 QEMU 下的归档异常
  5. 升级前备份完整数据，并在目标设备验证脚本、依赖和通知
