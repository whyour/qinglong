changeLog: |
  1. 修复 Node 24 下的开发启动，并恢复旧版定时任务的注册。
  2. 定时任务现可查看触发记录、运行实例、每日结果与调度耗时。并发运行时可单独停止指定实例并检查对应日志。
  3. 改进重启后的调度恢复、队列诊断，以及脚本和日志目录的分页读取。
  4. 配套远程 CLI 增补调度、实例和文件浏览相关的 OpenAPI 操作。
