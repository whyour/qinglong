# 发布准备时间；正式发布前更新为实际发布时间。
version: 2.23.0
changeLogLink: https://github.com/whyour/qinglong/blob/master/docs/releases/2.23.0.md
publishTime: 2026-10-10 0308
changeLog: |
  1. 新增脚本历史版本，支持内容对比和确认恢复，保存与恢复前保留旧内容
  2. Node 定时调度迁移至 node-cron，保留历史规则与日期/星期 OR 语义，增加三个时间宏
  3. 修复禁用、删除或修改任务后旧排队执行仍可能启动的问题
  4. 修复并发设置在调度进程及重启后的恢复，准确标记重启中断的实例
  5. 修复 Shell exit/exec/set -e 任务结束上报和后置钩子，保留显式命令环境
  6. task -m 超时覆盖 Shell 与解释器命令，终止任务进程组并记录超时结果
  7. 优化 Node 依赖路径缓存，JS/Python 通知依赖改为首次调用时加载
  8. 修复订阅参数、SSH 配置和强制删除，保护仍被其他订阅使用的共享目录
  9. 修复文件访问限制范围、自定义数据目录和脚本对比保存，完善环境变量导入校验
  10. 升级核对源码提交、静态文件及依赖锁，保留环境与数据，启动失败尝试恢复旧程序
  11. 修复 Debian 镜像源结果判断、登录来源限流、输入边界和中英文提示
  12. CLI 0.1.2 新增三个脚本历史命令，覆盖 146 条路由，完善冲突和未知执行结果提示
  13. 更新生产依赖安全补丁与 SQLite 安装链，增加全镜像矩阵及生产协议验证
  14. 升级前备份完整数据；脚本历史不代替备份，程序回滚不恢复数据库和用户数据
  15. 默认镜像更新受支持的 Node/Python 运行时，保留现有架构，强化发布包签名校验
