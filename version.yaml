version: 2.23.0
changeLogLink: https://github.com/whyour/qinglong/blob/master/docs/releases/2.23.0.md
publishTime: ""
changeLog: |
  1. 新增脚本历史版本查看、对比与恢复，支持 CLI 和 OpenAPI；恢复前检查当前内容哈希，避免覆盖并发修改
  2. 普通任务与订阅调度迁移到 node-cron，保留旧规则兼容及日期/星期 OR 语义，补充宏和夏令时说明
  3. 修复已失效排队任务仍被执行的问题，完善任务进程超时、停止和 Shell 环境传递
  4. 降低任务启动开销，JS/Python 通知依赖改为首次调用时加载
  5. 加固环境变量、订阅参数、文件访问和 SSH 配置输入，改善资源冲突与 CLI 错误反馈
  6. 修复页面升级、ql update 与静态资源版本同步，完善离线备份和升级产物校验
  7. 修复 Debian 依赖安装、通知与调度回归，补齐前端中英文翻译
  8. 最小修补 HTTP 压缩、上传、gRPC、代理 IP、WebSocket 和 JSON 查询相关依赖漏洞
  9. 远程 CLI 更新至 0.1.2，新增脚本历史命令，最低 Node.js 版本仍为 22.12
  10. 本次为 Python 3.10 兼容镜像的最后一个版本，发布后停止维护；升级前备份完整数据并验证脚本、依赖和通知
