# Example only. Discover the exact Kubernetes API endpoint used by Pods and
# replace the documentation-only TEST-NET address in a private overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ql3-worker-credential-executor
  namespace: qinglong3-system
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ql3-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 443
