  postgres-ai-credential-tester-url: REPLACE_WITH_TESTER_DSN
  postgres-tls-servername: REPLACE_WITH_POSTGRES_DNS_NAME
  postgres-ca.crt: REPLACE_WITH_POSTGRES_CA_PEM
