syntax = "proto3";

package com.ql.cron;

service Cron {
  rpc addCron(AddCronRequest) returns (AddCronResponse);
  rpc delCron(DeleteCronRequest) returns (DeleteCronResponse);
  rpc setConcurrency(SetConcurrencyRequest) returns (AddCronResponse);
}

message ISchedule { string schedule = 1; }

message ICron {
  string id = 1;
  string schedule = 2;
  string command = 3;
  repeated ISchedule extra_schedules = 4;
  string name = 5;
  optional uint32 max_queue_wait = 6;
  optional uint32 catchup_seconds = 7;
  optional int64 recovery_from = 8;
  optional bool skip_if_pending = 9;
}

message AddCronRequest {
  repeated ICron crons = 1;
  bool replace = 2;
}

message AddCronResponse {}

message DeleteCronRequest { repeated string ids = 1; }

message DeleteCronResponse {}

// Zero restores the default limit.
message SetConcurrencyRequest { int32 concurrency = 1; }
