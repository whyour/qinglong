name: 'QingLong 3.0 Image Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact QingLong 3 SemVer tag without the v prefix
        required: true
        type: string
      release_scope:
        description: Deployment family to publish
        required: true
        default: all
        type: choice
        options:
          - local
          - cluster
          - all

permissions:
  contents: read

concurrency:
  group: ql3-image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Freeze the source-derived release candidate contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cluster-evidence-required: ${{ steps.contract.outputs.cluster-evidence-required }}
      os-matrix: ${{ steps.contract.outputs.os-matrix }}
      publish-matrix: ${{ steps.contract.outputs.publish-matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Derive the exact deployment-family release plan
        id: contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          umask 077
          report="${RUNNER_TEMP}/ql3-release-candidate-contract.json"
          node scripts/ql3-release-candidate-contract.cjs \
            --mode=create \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --output="${report}"
          REPORT="${report}" node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const output = [
            `cluster-evidence-required=${report.releasePlan.clusterEvidenceRequired}`,
            `os-matrix=${JSON.stringify(report.releasePlan.osMatrix)}`,
            `publish-matrix=${JSON.stringify(report.releasePlan.publishMatrix)}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output.join('\n')}\n`);
          NODE

  worker-management-release-evidence:
    name: Audit private Worker management release evidence
    needs: release-candidate
    if: needs.release-candidate.outputs.cluster-evidence-required == 'true'
    runs-on: [self-hosted, linux, ql3-release-evidence-ephemeral]
    environment: ql3-production-release-evidence
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Re-audit commit-scoped private production evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "release source commit is malformed" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release version must be QingLong 3 SemVer" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${RELEASE_VERSION}" ]]; then
            echo "workflow dispatch must target the exact protected release tag" >&2
            exit 1
          fi
          evidence_dir="/run/qinglong3-release-evidence/${GITHUB_SHA}"
          node scripts/ql3-worker-credential-management-release-gate.cjs \
            --report="${evidence_dir}/worker-management-release-evidence.json" \
            --ceremony-report="${evidence_dir}/worker-management-ceremony.json" \
            --durable-audit-report="${evidence_dir}/worker-management-durable-audit.json" \
            --pki-rotation-report="${evidence_dir}/worker-management-pki-rotation-v2.json" \
            --ca-rollover-report="${evidence_dir}/worker-management-ca-rollover.json" \
            --source-commit="${GITHUB_SHA}" \
            --release-version="${RELEASE_VERSION}"

  cluster-dr-release-evidence:
    name: Audit private CloudNativePG disaster-recovery evidence
    needs: release-candidate
    if: needs.release-candidate.outputs.cluster-evidence-required == 'true'
    runs-on: [self-hosted, linux, ql3-release-evidence-ephemeral]
    environment: ql3-production-release-evidence
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Re-audit commit-scoped private disaster-recovery evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "release source commit is malformed" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release version must be QingLong 3 SemVer" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${RELEASE_VERSION}" ]]; then
            echo "workflow dispatch must target the exact protected release tag" >&2
            exit 1
          fi
          evidence_dir="/run/qinglong3-release-evidence/${GITHUB_SHA}"
          report="${evidence_dir}/cloudnativepg-dr-evidence.json"
          node scripts/ql3-cloudnativepg-backup-audit.cjs
          node scripts/ql3-barman-cloud-supply-chain-audit.cjs
          node scripts/ql3-cert-manager-selection-audit.cjs
          node scripts/ql3-cloudnativepg-dr-release-gate.cjs \
            --report="${report}" \
            --source-commit="${GITHUB_SHA}" \
            --release-version="${RELEASE_VERSION}"

  os-vulnerability:
    name: Scan ${{ matrix.image }} OS packages on ${{ matrix.image_arch }}
    needs: release-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-candidate.outputs.os-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Verify native scanner architecture
        run: node -e "if (process.arch !== '${{ matrix.node_arch }}') throw new Error('unexpected architecture ' + process.arch)"

      - name: Audit the bounded exception lifecycle
        run: node scripts/ql3-image-os-vulnerability-policy.cjs

      - name: Build the exact native OCI release artifact once
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ql3-native"
          docker buildx build \
            --platform linux/${{ matrix.image_arch }} \
            --file ${{ matrix.dockerfile }} \
            --target ${{ matrix.target }} \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --output "type=oci,dest=${RUNNER_TEMP}/ql3-native/image.oci.tar" \
            .

      - name: Materialize image-scoped Trivy exceptions
        run: >-
          node scripts/ql3-image-os-vulnerability-policy.cjs
          --image=${{ matrix.image }}
          --output=${{ runner.temp }}/ql3-${{ matrix.image }}-${{ matrix.image_arch }}.trivyignore.yaml

      - name: Reject unexcepted high or critical OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          input: ${{ runner.temp }}/ql3-native/image.oci.tar
          scanners: 'vuln'
          vuln-type: 'os'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'false'
          exit-code: '1'
          format: 'table'
          hide-progress: 'true'
          timeout: '10m0s'
          cache: 'false'
          trivyignores: ${{ runner.temp }}/ql3-${{ matrix.image }}-${{ matrix.image_arch }}.trivyignore.yaml

      - name: Bind the successful native scan to the OCI digest
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/ql3-native/layout"
          tar -xf "${RUNNER_TEMP}/ql3-native/image.oci.tar" \
            -C "${RUNNER_TEMP}/ql3-native/layout"
          node scripts/ql3-image-release-bundle.cjs \
            --mode=record-native \
            --image=${{ matrix.image }} \
            --platform=linux/${{ matrix.image_arch }} \
            --layout=${{ runner.temp }}/ql3-native/layout \
            --expected-revision=${{ github.sha }} \
            --evidence=${{ runner.temp }}/ql3-native/evidence.json
          rm "${RUNNER_TEMP}/ql3-native/image.oci.tar"

      - name: Upload the scanned immutable native OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ql3-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-${{ matrix.image_arch }}
          path: ${{ runner.temp }}/ql3-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    name: Publish immutable multi-architecture ${{ matrix.image }} image
    needs:
      - release-candidate
      - worker-management-release-evidence
      - cluster-dr-release-evidence
      - os-vulnerability
    if: >-
      always() &&
      needs.release-candidate.result == 'success' &&
      needs.os-vulnerability.result == 'success' &&
      (
        needs.release-candidate.outputs.cluster-evidence-required != 'true' ||
        (
          needs.worker-management-release-evidence.result == 'success' &&
          needs.cluster-dr-release-evidence.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-candidate.outputs.publish-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Recreate and audit the source-derived release candidate contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          umask 077
          contract="${RUNNER_TEMP}/${{ matrix.repository }}-release-candidate-contract.json"
          node scripts/ql3-release-candidate-contract.cjs \
            --mode=create \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --output="${contract}"
          audit="${RUNNER_TEMP}/${{ matrix.repository }}-release-candidate-audit.json"
          node scripts/ql3-release-candidate-contract.cjs \
            --mode=audit \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --report="${contract}" > "${audit}"

      - name: Resolve and validate release identity
        id: identity
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${IMAGE_REPOSITORY}"
          version="${DISPATCH_VERSION}"
          if [[ ! "${version}" =~ ^3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release version must be QingLong 3 SemVer" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "release source must be the exact requested tag" >&2
            exit 1
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Generate and audit the reviewed application SBOM
        run: >-
          node scripts/ql3-cluster-image-sbom.cjs
          --image=${{ matrix.image }}
          --output=${{ runner.temp }}/${{ matrix.repository }}.cdx.json

      - name: Reject high or critical production dependency advisories
        run: >-
          npm audit
          --omit=dev
          --audit-level=high
          --prefix=${{ matrix.runtime_root }}

      - name: Download the exact scanned amd64 OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ql3-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-amd64
          path: ${{ runner.temp }}/native/amd64

      - name: Download the exact scanned arm64 OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ql3-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-arm64
          path: ${{ runner.temp }}/native/arm64

      - name: Merge and re-audit the scanned OCI digest without rebuilding
        id: bundle
        run: |
          set -euo pipefail
          node scripts/ql3-image-release-bundle.cjs \
            --mode=merge \
            --image=${{ matrix.image }} \
            --amd64-layout=${RUNNER_TEMP}/native/amd64/layout \
            --amd64-evidence=${RUNNER_TEMP}/native/amd64/evidence.json \
            --arm64-layout=${RUNNER_TEMP}/native/arm64/layout \
            --arm64-evidence=${RUNNER_TEMP}/native/arm64/evidence.json \
            --expected-revision=${GITHUB_SHA} \
            --output=${RUNNER_TEMP}/${{ matrix.repository }}-release-layout \
            --predicate=${RUNNER_TEMP}/${{ matrix.repository }}-os-vulnerability.json \
            --report=${RUNNER_TEMP}/${{ matrix.repository }}-bundle.json
          digest="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!/^sha256:[0-9a-f]{64}$/.test(value.rootIndexDigest))process.exit(1);process.stdout.write(value.rootIndexDigest)' "${RUNNER_TEMP}/${{ matrix.repository }}-bundle.json")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          tar -C "${RUNNER_TEMP}/${{ matrix.repository }}-release-layout" \
            -cf "${RUNNER_TEMP}/${{ matrix.repository }}-release.oci.tar" .

      - name: Install the exact checksum-pinned OCI copier
        env:
          REGCTL: ${{ runner.temp }}/regctl
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${REGCTL}" \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo "c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  ${REGCTL}" | sha256sum --check --strict
          chmod 0755 "${REGCTL}"
          "${REGCTL}" version

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import the scanned OCI graph by digest without a public tag
        id: push
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
          ARCHIVE: ${{ runner.temp }}/${{ matrix.repository }}-release.oci.tar
          REGCTL: ${{ runner.temp }}/regctl
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "bundle did not return an immutable SHA-256 digest" >&2
            exit 1
          fi
          "${REGCTL}" image import "${IMAGE}@${DIGEST}" "${ARCHIVE}"
          remote_digest="$("${REGCTL}" image digest "${IMAGE}@${DIGEST}")"
          if [[ "${remote_digest}" != "${DIGEST}" ]]; then
            echo "registry changed the scanned OCI digest" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keylessly sign the immutable manifest digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the reviewed CycloneDX application SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.repository }}.cdx.json
          push-to-registry: true

      - name: Attest the digest-bound OS vulnerability evidence
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://qinglong.dev/attestations/image-os-vulnerability/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.repository }}-os-vulnerability.json
          push-to-registry: true

      - name: Attest the source-derived release candidate contract
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://qinglong.dev/attestations/release-candidate-contract/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.repository }}-release-candidate-contract.json
          push-to-registry: true

      - name: Verify the published manifest and attestation bindings
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/${{ matrix.repository }}-index.json"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > "${manifest}"
          node scripts/ql3-cluster-remote-manifest-audit.cjs \
            --manifest="${manifest}" \
            --expected-image="${IMAGE}" \
            --expected-digest="${DIGEST}"

      - name: Verify local rollout compatibility against the pushed digest
        if: matrix.image == 'local'
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @qinglong/local-owner-cli check
          docker pull "${IMAGE}@${DIGEST}"
          docker_executable="$(realpath "$(command -v docker)")"
          docker_socket="$(realpath /var/run/docker.sock)"
          node scripts/ql3-local-compose-rollout-live-contract.cjs \
            --image="${IMAGE}@${DIGEST}" \
            --docker-executable="${docker_executable}" \
            --docker-socket="${docker_socket}" \
            --profile=edge
          node scripts/ql3-local-compose-rollout-live-contract.cjs \
            --image="${IMAGE}@${DIGEST}" \
            --docker-executable="${docker_executable}" \
            --docker-socket="${docker_socket}" \
            --profile=standalone

      - name: Verify the keyless signature identity
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Verify GitHub SLSA provenance from the published OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners \
            --bundle-from-oci

      - name: Verify the reviewed CycloneDX attestation from the OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --predicate-type "https://cyclonedx.org/bom" \
            --deny-self-hosted-runners \
            --bundle-from-oci

      - name: Verify the OS vulnerability evidence from the OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --predicate-type "https://qinglong.dev/attestations/image-os-vulnerability/v1" \
            --deny-self-hosted-runners \
            --bundle-from-oci

      - name: Verify the release candidate contract from the OCI registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --predicate-type "https://qinglong.dev/attestations/release-candidate-contract/v1" \
            --deny-self-hosted-runners \
            --bundle-from-oci

      - name: Record the fully verified image for release-set aggregation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir "${RUNNER_TEMP}/release-record"
          node scripts/ql3-release-set-contract.cjs \
            --mode=record-image \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --candidate="${RUNNER_TEMP}/${{ matrix.repository }}-release-candidate-contract.json" \
            --image="${{ matrix.image }}" \
            --digest="${DIGEST}" \
            --output="${RUNNER_TEMP}/release-record/${{ matrix.image }}.json"

      - name: Upload the same-run verified image record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ql3-release-record-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          path: ${{ runner.temp }}/release-record/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  release-set:
    name: Close and publish the complete deployment release set
    needs:
      - release-candidate
      - publish
    if: >-
      always() &&
      needs.release-candidate.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Download every same-run verified image record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ql3-release-record-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/release-records
          merge-multiple: true

      - name: Aggregate and independently audit the complete release set
        id: release-set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          umask 077
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          source_repository="${GITHUB_REPOSITORY,,}"
          candidate="${RUNNER_TEMP}/release-set-candidate.json"
          bundle="${RUNNER_TEMP}/release-catalog-bundle"
          mkdir "${bundle}"
          report="${bundle}/qinglong3-release-set-${RELEASE_VERSION}-${RELEASE_SCOPE}.json"
          plan="${bundle}/qinglong3-release-catalog-plan-${RELEASE_VERSION}-${RELEASE_SCOPE}.json"
          node scripts/ql3-release-candidate-contract.cjs \
            --mode=create \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --output="${candidate}"
          node scripts/ql3-release-set-contract.cjs \
            --mode=aggregate \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --candidate="${candidate}" \
            --records="${RUNNER_TEMP}/release-records" \
            --output="${report}"
          node scripts/ql3-release-set-contract.cjs \
            --mode=audit \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --candidate="${candidate}" \
            --records="${RUNNER_TEMP}/release-records" \
            --report="${report}" > "${RUNNER_TEMP}/release-set-audit.json"
          node scripts/ql3-release-set-contract.cjs \
            --mode=inspect \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --report="${report}" > "${RUNNER_TEMP}/release-set-inspection.json"
          node scripts/ql3-release-catalog-contract.cjs \
            --mode=plan \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --source-repository="${source_repository}" \
            --release-set="${report}" \
            --output="${plan}"
          echo "report=${report}" >> "${GITHUB_OUTPUT}"
          echo "plan=${plan}" >> "${GITHUB_OUTPUT}"
          echo "bundle=${bundle}" >> "${GITHUB_OUTPUT}"

      - name: Install the exact checksum-pinned OCI copier
        env:
          REGCTL: ${{ runner.temp }}/regctl
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${REGCTL}" \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo "c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  ${REGCTL}" | sha256sum --check --strict
          chmod 0755 "${REGCTL}"
          "${REGCTL}" version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tags only after the complete set is verified
        env:
          REGCTL: ${{ runner.temp }}/regctl
          RELEASE_SET: ${{ steps.release-set.outputs.report }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const report = JSON.parse(fs.readFileSync(process.env.RELEASE_SET, 'utf8'));
          const regctl = process.env.REGCTL;
          const run = (args, allowFailure = false) => {
            const result = spawnSync(regctl, args, {
              encoding: 'utf8',
              maxBuffer: 1024 * 1024,
            });
            if (result.error) throw result.error;
            if (!allowFailure && result.status !== 0) {
              throw new Error(`regctl ${args.join(' ')} failed`);
            }
            return result;
          };
          const states = [];
          for (const image of report.images) {
            const source = run(['image', 'digest', image.reference]).stdout.trim();
            if (source !== image.digest) throw new Error('source digest drifted before promotion');
            for (const tag of [image.versionTag, image.sourceTag]) {
              const current = run(['image', 'digest', tag], true);
              if (current.status === 0 && current.stdout.trim() !== image.digest) {
                throw new Error('release tag already points at another digest');
              }
              states.push({ image, tag, current: current.status === 0 });
            }
          }
          for (const state of states) {
            if (!state.current) {
              run(['image', 'copy', state.image.reference, state.tag]);
            }
            const promoted = run(['image', 'digest', state.tag]).stdout.trim();
            if (promoted !== state.image.digest) {
              throw new Error('promoted tag does not resolve to the release-set digest');
            }
          }
          NODE

      - name: Attest the complete release-set file provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.release-set.outputs.report }}

      - name: Publish and round-trip the durable OCI release catalog
        id: catalog
        env:
          REGCTL: ${{ runner.temp }}/regctl
          RELEASE_SET: ${{ steps.release-set.outputs.report }}
          PLAN: ${{ steps.release-set.outputs.plan }}
        run: |
          set -euo pipefail
          catalog_repository="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.catalog.registryRepository)' "${PLAN}")"
          discovery_tag="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.catalog.discoveryTag)' "${PLAN}")"
          artifact_type="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.catalog.artifactType)' "${PLAN}")"
          file_media_type="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.catalog.fileMediaType)' "${PLAN}")"
          file_name="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.releaseSet.fileName)' "${PLAN}")"
          "${REGCTL}" artifact put \
            --artifact-type "${artifact_type}" \
            --file-media-type "${file_media_type}" \
            --file "${RELEASE_SET}" \
            --file-title \
            --strip-dirs \
            --annotation "dev.qinglong.release.scope=${{ inputs.release_scope }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY,,}" \
            --annotation "org.opencontainers.image.version=${{ inputs.version }}" \
            "${discovery_tag}"
          digest="$("${REGCTL}" image digest "${discovery_tag}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "release catalog did not resolve to an immutable digest" >&2
            exit 1
          fi
          immutable_reference="${catalog_repository}@${digest}"
          roundtrip="${RUNNER_TEMP}/release-set-roundtrip.json"
          manifest="${RUNNER_TEMP}/release-catalog-manifest.json"
          "${REGCTL}" artifact get --file "${file_name}" "${immutable_reference}" > "${roundtrip}"
          cmp --silent "${RELEASE_SET}" "${roundtrip}"
          "${REGCTL}" manifest get "${immutable_reference}" --format raw-body > "${manifest}"
          echo "repository=${catalog_repository}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Keylessly sign the immutable release-catalog digest
        env:
          CATALOG: ${{ steps.catalog.outputs.repository }}
          DIGEST: ${{ steps.catalog.outputs.digest }}
        run: cosign sign --yes "${CATALOG}@${DIGEST}"

      - name: Attest durable release-catalog provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.catalog.outputs.repository }}
          subject-digest: ${{ steps.catalog.outputs.digest }}
          push-to-registry: true

      - name: Verify the durable catalog and create its immutable receipt
        id: catalog-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          CATALOG: ${{ steps.catalog.outputs.repository }}
          DIGEST: ${{ steps.catalog.outputs.digest }}
          MANIFEST: ${{ steps.catalog.outputs.manifest }}
          PLAN: ${{ steps.release-set.outputs.plan }}
          BUNDLE: ${{ steps.release-set.outputs.bundle }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CATALOG}@${DIGEST}"
          gh attestation verify "oci://${CATALOG}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ql3-image-release.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners \
            --bundle-from-oci
          receipt="${BUNDLE}/qinglong3-release-catalog-receipt-${RELEASE_VERSION}-${RELEASE_SCOPE}.json"
          node scripts/ql3-release-catalog-contract.cjs \
            --mode=receipt \
            --plan="${PLAN}" \
            --manifest="${MANIFEST}" \
            --manifest-digest="${DIGEST}" \
            --output="${receipt}"
          node scripts/ql3-release-catalog-contract.cjs \
            --mode=audit \
            --plan="${PLAN}" \
            --manifest="${MANIFEST}" \
            --manifest-digest="${DIGEST}" \
            --receipt="${receipt}" > "${RUNNER_TEMP}/release-catalog-audit.json"
          echo "receipt=${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Attest the immutable release-catalog receipt
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.catalog-receipt.outputs.receipt }}

      - name: Publish the deployment digest lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ql3-release-set-${{ inputs.version }}-${{ inputs.release_scope }}
          path: ${{ steps.release-set.outputs.bundle }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  release-catalog-deployment-live:
    name: Consume the public catalog and prove the cluster release on K3s
    needs: release-set
    if: always() && needs.release-set.result == 'success' && inputs.release_scope != 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      - name: Install the frozen workspace without lifecycle scripts
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.3.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the exact checksum-pinned catalog reader
        env:
          REGCTL: ${{ runner.temp }}/regctl
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${REGCTL}" \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo "c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  ${REGCTL}" | sha256sum --check --strict
          chmod 0755 "${REGCTL}"
          "${REGCTL}" version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install verified kubectl v1.34.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/kubectl" \
            https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl.sha256
          test "$(cat "${RUNNER_TEMP}/kubectl.sha256")" = \
            "$(sha256sum "${RUNNER_TEMP}/kubectl" | cut -d ' ' -f 1)"
          chmod 0755 "${RUNNER_TEMP}/kubectl"

      - name: Consume and independently audit the published OCI catalog
        id: catalog-consumption
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          REGCTL: ${{ runner.temp }}/regctl
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          owner="${REPOSITORY_OWNER,,}"
          source_repository="${SOURCE_REPOSITORY,,}"
          private_root="${RUNNER_TEMP}/ql3-release-catalog-consumer"
          bundle="${private_root}/bundle"
          token="${private_root}/github-token"
          install -d -m 0700 "${private_root}"
          install -m 0600 /dev/null "${token}"
          printf '%s' "${GH_TOKEN}" > "${token}"
          trap 'rm -f "${token}"' EXIT
          cosign="$(readlink -f "$(command -v cosign)")"
          gh="$(readlink -f "$(command -v gh)")"
          node scripts/ql3-release-catalog-consumption-ceremony.cjs \
            --mode=create \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --source-repository="${source_repository}" \
            --output-directory="${bundle}" \
            --regctl="${REGCTL}" \
            --cosign="${cosign}" \
            --gh="${gh}" \
            --github-token-file="${token}"
          node scripts/ql3-release-catalog-consumption-ceremony.cjs \
            --mode=audit \
            --version="${RELEASE_VERSION}" \
            --source-revision="${GITHUB_SHA}" \
            --source-ref="${GITHUB_REF}" \
            --release-scope="${RELEASE_SCOPE}" \
            --repository-owner="${owner}" \
            --source-repository="${source_repository}" \
            --output-directory="${bundle}"
          rm -f "${token}"
          trap - EXIT
          echo "bundle=${bundle}" >> "${GITHUB_OUTPUT}"
          echo "repository-owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "source-repository=${source_repository}" >> "${GITHUB_OUTPUT}"

      - name: Preload the digest-reviewed K3s distribution
        shell: bash
        run: |
          set -euo pipefail
          docker pull \
            rancher/k3s@sha256:71abd3a56f57884c62732e0e0d87606052cb5f8555b7db7e8e33c04570b8175c
          docker tag \
            rancher/k3s@sha256:71abd3a56f57884c62732e0e0d87606052cb5f8555b7db7e8e33c04570b8175c \
            rancher/k3s:v1.34.3-k3s1

      - name: Prove catalog-bound install and fenced retirement on three K3s nodes
        env:
          QL3_KUBECTL_BIN: ${{ runner.temp }}/kubectl
          QL3_DEPLOYMENT_LIVE_REPORT: ${{ runner.temp }}/ql3-release-catalog-deployment/report.json
          QL3_RELEASE_CATALOG_CONSUMPTION_BUNDLE: ${{ steps.catalog-consumption.outputs.bundle }}
          QL3_RELEASE_SOURCE_REVISION: ${{ github.sha }}
          QL3_RELEASE_SOURCE_REF: ${{ github.ref }}
          QL3_RELEASE_SCOPE: ${{ inputs.release_scope }}
          QL3_RELEASE_REPOSITORY_OWNER: ${{ steps.catalog-consumption.outputs.repository-owner }}
          QL3_RELEASE_SOURCE_REPOSITORY: ${{ steps.catalog-consumption.outputs.source-repository }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$(dirname "${QL3_DEPLOYMENT_LIVE_REPORT}")"
          node scripts/ql3-kubernetes-deployment-live-contract.cjs > \
            "${QL3_DEPLOYMENT_LIVE_REPORT}"
          node -e \
            "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync(process.env.QL3_DEPLOYMENT_LIVE_REPORT,'utf8'));const d=/^sha256:[a-f0-9]{64}$/;if(r.cleanupComplete!==true||r.receiptAuditCompatible!==true||r.retirement?.receiptAuditCompatible!==true||r.retirement?.targetAbsent!==true||r.retirement?.uidResourceVersionDeletePreconditions!==true||r.releaseAuthority?.mode!=='verified_release_catalog'||r.releaseAuthority?.sourceRevision!==process.env.GITHUB_SHA||r.releaseAuthority?.sourceRef!==process.env.GITHUB_REF||r.releaseAuthority?.scope!==process.env.QL3_RELEASE_SCOPE||!d.test(r.releaseAuthority?.releaseSetDigest||'')||!d.test(r.releaseAuthority?.catalogManifestDigest||'')||!d.test(r.releaseAuthority?.catalogConsumptionDigest||''))process.exit(1)"

      - name: Verify isolated release-gate cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq --filter name=ql3-deploy-live-)"
          test -z "$(docker network ls -q --filter name=ql3-deploy-live-)"

      - name: Upload content-free catalog deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ql3-release-catalog-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ql3-release-catalog-deployment/report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9
          overwrite: false
          include-hidden-files: false
