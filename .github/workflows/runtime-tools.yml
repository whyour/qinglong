name: Build verified runtime tools

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build the pinned universal Linux tool archive
        env:
          QL_TOOLS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build-runtime-tools.sh "$RUNNER_TEMP/qinglong-runtime-tools"
      - uses: actions/upload-artifact@v6
        with:
          name: qinglong-runtime-tools-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qinglong-runtime-tools/runtime-tools.tgz
            ${{ runner.temp }}/qinglong-runtime-tools/runtime-tools-proof.json
          compression-level: 0
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qinglong-runtime-tools-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qinglong-runtime-tools/logs/
          if-no-files-found: ignore
